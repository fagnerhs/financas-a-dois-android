name: Build APK assinado
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4
      - name: Instalar plataforma e build-tools Android 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Criar Gradle Wrapper e compilar
        run: |
          gradle wrapper --gradle-version 8.14.4
          chmod +x gradlew
          ./gradlew test assembleRelease --no-daemon
      - name: Assinar e verificar APK para instalação
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_RELEASE_KEY_ALIAS" \
            --ks-pass env:ANDROID_RELEASE_PASSWORD \
            --key-pass env:ANDROID_RELEASE_PASSWORD \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: financas-casal-apk
          path: app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30
