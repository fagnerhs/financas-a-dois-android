name: Build APK assinado
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Gerar Gradle Wrapper e build de release
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew test assembleRelease --no-daemon
      - name: Assinar APK para instalação
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'temporaria' }}" -keypass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'temporaria' }}" -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Financas a Dois, OU=Personal, O=Financas a Dois, L=NA, S=NA, C=BR"
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias release --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'temporaria' }}" --key-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'temporaria' }}" --out app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify app/build/outputs/apk/release/app-release-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: financas-casal-apk
          path: app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30
