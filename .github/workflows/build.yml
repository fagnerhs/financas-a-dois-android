name: Build APK assinado
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4
      - name: Instalar plataforma e build-tools Android 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Criar Gradle Wrapper e compilar
        run: |
          gradle wrapper --gradle-version 8.14.4
          chmod +x gradlew
          ./gradlew test assembleRelease --no-daemon
      - name: Assinar e verificar APK para instalação
        run: |
          STORE_PASS=$(openssl rand -hex 32)
          KEY_PASS=$(openssl rand -hex 32)
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Financas a Dois, OU=Android, O=Financas a Dois, L=NA, S=NA, C=BR"
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias release \
            --ks-pass pass:"$STORE_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: financas-casal-apk
          path: app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30
